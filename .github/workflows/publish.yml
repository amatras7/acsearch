name: Update and publish literature
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh Crossref metadata
        run: python scripts/update.py
        env:
          CROSSREF_EMAIL: ${{ vars.CROSSREF_EMAIL }}
      - name: Save the latest snapshot
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/papers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update literature snapshot"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: pages
