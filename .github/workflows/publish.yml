name: Update and publish literature
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh Crossref metadata
        run: python scripts/update.py
        env:
          CROSSREF_EMAIL: ${{ vars.CROSSREF_EMAIL }}
      - name: Keep the schedule alive
        continue-on-error: true
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .heartbeat 2>/dev/null)" != "$month" ]; then
            printf '%s\n' "$month" > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "chore: heartbeat $month [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: pages
